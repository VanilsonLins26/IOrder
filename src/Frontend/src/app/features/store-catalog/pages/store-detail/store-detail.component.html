<div class="page-container">
  @if (loadingStore()) {
    <div class="store-skeleton">
      <app-loading-skeleton height="280px" border-radius="var(--radius-2xl)" />
    </div>
  } @else if (store()) {
    <app-store-info-header [store]="store()!" />

    <div class="store-products-section">
      @if (loadingProducts() || loadingCategories()) {
        <app-loading-skeleton height="200px" />
      } @else {
        @for (group of groupedProducts(); track group.id) {
          <div class="category-group">
            <h2 class="category-title">{{ group.name }}</h2>
            <app-product-grid 
              [products]="group.products"
              [isLoading]="false"
              (addToCart)="onAddToCart($event)"
            />
          </div>
        }
      }
    </div>
  } @else {
    <!-- Error or not found state -->
    <div class="store-not-found">
      <h1>Loja não encontrada</h1>
      <p>A loja que você procura não existe ou está indisponível.</p>
    </div>
  }
</div>
